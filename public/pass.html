<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CheerRunners - Melbourne Marathon VIP Pass</title>
    
    <!-- Google Fonts: Days One & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Days+One&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- Favicon & Touch Icons: Circular Centered Microphone (Coral for Site, Grey for Local) -->
    <link rel="icon" id="app-favicon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2216%22%20fill%3D%22%23ee2737%22%2F%3E%3Cg%20transform%3D%22translate(16%2C%2016)%20scale(0.68)%20translate(-12%2C%20-12)%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M12%2014c1.66%200%203-1.34%203-3V5c0-1.66-1.34-3-3-3S9%203.34%209%205v6c0%201.66%201.34%203%203%203zm5-3c0%202.76-2.24%205-5%205s-5-2.24-5-5H5c0%203.53%202.61%206.43%206%206.92V21h2v-3.08c3.39-.49%206-3.39%206-6.92h-2z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
    <link rel="apple-touch-icon" id="app-apple-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2216%22%20fill%3D%22%23ee2737%22%2F%3E%3Cg%20transform%3D%22translate(16%2C%2016)%20scale(0.68)%20translate(-12%2C%20-12)%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M12%2014c1.66%200%203-1.34%203-3V5c0-1.66-1.34-3-3-3S9%203.34%209%205v6c0%201.66%201.34%203%203%203zm5-3c0%202.76-2.24%205-5%205s-5-2.24-5-5H5c0%203.53%202.61%206.43%206%206.92V21h2v-3.08c3.39-.49%206-3.39%206-6.92h-2z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">

    <script>
        (function() {
            const isLocal = window.location.hostname === 'localhost' || 
                            window.location.hostname === '127.0.0.1' || 
                            window.location.hostname.endsWith('.local') ||
                            window.location.protocol === 'file:';
            const micPath = 'M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z';
            const bg = isLocal ? '%23525e6f' : '%23ee2737'; // Grey for Local, Coral for Site
            const svgUri = `data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2216%22%20fill%3D%22${bg}%22%2F%3E%3Cg%20transform%3D%22translate(16%2C%2016)%20scale(0.68)%20translate(-12%2C%20-12)%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22${micPath}%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E`;
            
            const fav = document.getElementById('app-favicon');
            if (fav) fav.href = svgUri;
            const appleFav = document.getElementById('app-apple-icon');
            if (appleFav) appleFav.href = svgUri;
        })();
    </script>
    
    <style>
        :root {
            --melb-red: #ee2737;
            --melb-dark: #090d15;
            --melb-card: #121824;
            --melb-green: #39ff14;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--melb-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(238, 39, 55, 0.22) 0%, transparent 60%),
                radial-gradient(circle at 10% 90%, rgba(57, 255, 20, 0.08) 0%, transparent 50%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .pass-container {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(180deg, #182030 0%, #0f1420 100%);
            border: 2px solid rgba(238, 39, 55, 0.4);
            border-radius: 28px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), 0 0 40px rgba(238, 39, 55, 0.25);
            padding: 32px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }

        .pass-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #ee2737, #ff6b78, #ee2737);
        }

        .pass-badge-pill {
            background: rgba(238, 39, 55, 0.15);
            border: 1px solid var(--melb-red);
            color: #ff6b78;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: 20px;
        }

        .pass-title {
            font-family: 'Days One', sans-serif;
            font-size: 1.6rem;
            color: #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .pass-subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: -8px;
        }

        /* QR Code Container with High Contrast */
        .qr-card-wrap {
            background: #ffffff;
            border-radius: 22px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 250px;
            height: 250px;
            margin: 4px auto;
        }

        .qr-card-wrap img {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 12px;
        }

        .pass-hint-box {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 16px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .pass-hint-label {
            font-size: 0.72rem;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .pass-key-display {
            font-family: 'Days One', monospace;
            font-size: 1.25rem;
            color: var(--melb-green);
            letter-spacing: 2px;
            user-select: all;
        }

        .pass-action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            width: 100%;
        }

        .btn-primary {
            background: var(--melb-red);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(238, 39, 55, 0.45);
        }

        .btn-primary:hover {
            background: #d81827;
            transform: translateY(-2px);
            box-shadow: 0 6px 26px rgba(238, 39, 55, 0.65);
        }

        .btn-whatsapp {
            background: #25d366;
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(37, 211, 102, 0.35);
        }

        .btn-whatsapp:hover {
            background: #1eb857;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .toast-msg {
            position: fixed;
            bottom: 24px;
            background: #22c55e;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.9rem;
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: none;
            z-index: 100;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="pass-container">
        <span class="pass-badge-pill">Official VIP Access</span>
        
        <h1 class="pass-title">CheerRunners</h1>
        <p class="pass-subtitle">Melbourne Marathon 2026 • Live Cheering Arena</p>
        
        <div class="qr-card-wrap">
            <img src="qr_irizar_mm2026.png" alt="CheerRunners VIP Access QR Code">
        </div>

        <div class="pass-hint-box">
            <span class="pass-hint-label">Access Pass Key</span>
            <span class="pass-key-display" id="pass-key-text">IrizarMM2026</span>
            <span style="font-size: 0.72rem; color: #94a3b8;">Scanning the QR Code logs in automatically!</span>
        </div>

        <div class="pass-action-buttons">
            <a href="index.html?key=IrizarMM2026" class="btn-action btn-primary">
                <span>Enter Live Arena ➔</span>
            </a>
            
            <a id="btn-share-whatsapp" href="#" target="_blank" class="btn-action btn-whatsapp">
                <span>Share on WhatsApp 📲</span>
            </a>

            <button type="button" id="btn-copy-link" class="btn-action btn-secondary">
                <span>Copy 1-Click Link 📋</span>
            </button>
        </div>
    </div>

    <div id="toast" class="toast-msg">Link copied to clipboard!</div>

    <script>
        const bypassUrl = window.location.origin + window.location.pathname.replace('pass.html', '') + '?key=IrizarMM2026';
        const shareText = encodeURIComponent('🏃 CheerRunners - Torcida e GPS da Maratona de Melbourne ao vivo!\nAcesse direto pelo link: ' + bypassUrl);
        
        document.getElementById('btn-share-whatsapp').href = 'https://api.whatsapp.com/send?text=' + shareText;

        document.getElementById('btn-copy-link').addEventListener('click', () => {
            navigator.clipboard.writeText(bypassUrl).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2200);
            });
        });
    </script>
</body>
</html>
